SB_CONFIG_BOOTLOADER_MCUBOOT=y
# OVERWRITE_ONLY: MCUboot copies slot1 to slot0 on the next reset when
# the BMC has staged an image and asked for the upgrade. Required by the
# `ota url` command (CONFIG_APP_OTA). The old SINGLE_APP setting built a
# one-slot bootloader with no swap support at all, which silently no-ops
# every OTA. OVERWRITE_ONLY does not retain a rollback copy of slot0 so
# a bad image bricks until reflash, but it avoids the scratch partition
# the swap-with-revert modes need.
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
